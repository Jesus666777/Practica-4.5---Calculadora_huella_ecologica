<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculadora de huella ecológica</title>
<style>
  :root {
    --verde-oscuro: #1f4d3a;
    --verde: #2f7a56;
    --verde-claro: #e3f1e6;
    --arena: #f6f4ec;
    --cielo: #dff0f5;
    --texto: #1c2b24;
    --borde: #b9d3c3;
    --error: #a63a2b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", Tahoma, Arial, sans-serif;
    color: var(--texto);
    background: linear-gradient(180deg, var(--cielo) 0, var(--arena) 260px);
    line-height: 1.5;
  }
  header {
    background: var(--verde-oscuro);
    color: #fff;
    padding: 36px 20px 40px;
    text-align: center;
  }
  header h1 { margin: 0 0 10px; font-size: clamp(1.6rem, 5vw, 2.4rem); }
  header p { margin: 0 auto; max-width: 620px; font-size: 1.05rem; opacity: .92; }
  main { max-width: 760px; margin: -22px auto 40px; padding: 0 16px; }
  form {
    background: #fff;
    border: 1px solid var(--borde);
    border-radius: 14px;
    padding: 22px;
  }
  fieldset {
    border: 0;
    border-top: 3px solid var(--verde);
    margin: 0 0 22px;
    padding: 12px 0 0;
  }
  legend { font-size: 1.15rem; font-weight: 700; color: var(--verde-oscuro); padding-right: 10px; }
  .campo { margin: 14px 0; }
  label { display: block; font-weight: 600; margin-bottom: 5px; }
  select, input[type="number"] {
    width: 100%;
    padding: 10px 12px;
    font-size: 1rem;
    border: 1px solid var(--borde);
    border-radius: 8px;
    background: var(--arena);
    color: var(--texto);
  }
  select:focus, input:focus, button:focus-visible {
    outline: 3px solid #7cc4a0;
    outline-offset: 1px;
  }
  button {
    width: 100%;
    padding: 14px;
    font-size: 1.1rem;
    font-weight: 700;
    color: #fff;
    background: var(--verde);
    border: 0;
    border-radius: 10px;
    cursor: pointer;
  }
  button:hover:not(:disabled) { background: var(--verde-oscuro); }
  button:disabled { background: #8fb3a0; cursor: wait; }
  #estado { margin-top: 18px; font-weight: 600; color: var(--verde-oscuro); }
  #estado.error { color: var(--error); }
  #resultado {
    display: none;
    margin-top: 18px;
    padding: 18px;
    background: var(--verde-claro);
    border: 1px solid var(--borde);
    border-left: 6px solid var(--verde);
    border-radius: 10px;
    white-space: pre-line;
  }
  footer { text-align: center; font-size: .85rem; color: #52665b; padding: 0 16px 28px; }
</style>
</head>
<body>

<header>
  <h1>Calculadora de huella ecológica</h1>
  <p>Si todos vivieran como tú, ¿cuántos planetas Tierra harían falta? Contesta el cuestionario y descúbrelo.</p>
</header>

<main>
  <form id="formulario">

    <fieldset>
      <legend>Alimentación</legend>
      <div class="campo">
        <label for="carne">¿Cada cuánto comes carne de res o cerdo?</label>
        <select id="carne" name="carne" required>
          <option value="Nunca">Nunca</option>
          <option value="1-2 veces por semana">1-2 veces por semana</option>
          <option value="3-5 veces por semana">3-5 veces por semana</option>
          <option value="Diario">Diario</option>
        </select>
      </div>
      <div class="campo">
        <label for="local">¿Qué parte de tu comida es local o de temporada?</label>
        <select id="local" name="local" required>
          <option value="Casi nada">Casi nada</option>
          <option value="La mitad">La mitad</option>
          <option value="Casi toda">Casi toda</option>
        </select>
      </div>
    </fieldset>

    <fieldset>
      <legend>Transporte</legend>
      <div class="campo">
        <label for="transporte">Medio de transporte principal</label>
        <select id="transporte" name="transporte" required>
          <option value="Caminar o bicicleta">Caminar o bicicleta</option>
          <option value="Camion urbano">Camión urbano</option>
          <option value="Moto">Moto</option>
          <option value="Auto propio">Auto propio</option>
        </select>
      </div>
      <div class="campo">
        <label for="km">Kilómetros que recorres al día</label>
        <input type="number" id="km" name="km" min="0" step="any" required placeholder="Ej. 10">
      </div>
      <div class="campo">
        <label for="vuelos">Vuelos en avión al año</label>
        <input type="number" id="vuelos" name="vuelos" min="0" step="1" required placeholder="Ej. 2">
      </div>
    </fieldset>

    <fieldset>
      <legend>Energía</legend>
      <div class="campo">
        <label for="aire">Horas al día de aire acondicionado en casa</label>
        <input type="number" id="aire" name="aire" min="0" max="24" step="any" required placeholder="Ej. 8">
      </div>
      <div class="campo">
        <label for="personas">Personas que viven en tu casa</label>
        <input type="number" id="personas" name="personas" min="1" step="1" required placeholder="Ej. 4">
      </div>
    </fieldset>

    <fieldset>
      <legend>Consumo</legend>
      <div class="campo">
        <label for="ropa">Prendas nuevas que compras al mes</label>
        <input type="number" id="ropa" name="ropa" min="0" step="1" required placeholder="Ej. 2">
      </div>
      <div class="campo">
        <label for="celular">Cada cuántos años cambias de celular</label>
        <input type="number" id="celular" name="celular" min="0" step="any" required placeholder="Ej. 3">
      </div>
    </fieldset>

    <fieldset>
      <legend>Residuos</legend>
      <div class="campo">
        <label for="separa">¿Separas la basura?</label>
        <select id="separa" name="separa" required>
          <option value="Si">Sí</option>
          <option value="A veces">A veces</option>
          <option value="No">No</option>
        </select>
      </div>
    </fieldset>

    <button type="submit" id="boton">Calcular mi huella</button>
    <div id="estado" role="status" aria-live="polite"></div>
    <div id="resultado" aria-live="polite"></div>
  </form>
</main>

<footer>Estimación aproximada hecha con IA. No es un cálculo oficial.</footer>

<script>
  // Pega aquí la URL de tu webhook de Make (Webhooks → Custom webhook)
  const WEBHOOK_URL = "https://hook.us2.make.com/cz3r5f1aa8rl89c1a189w3o9o8uetowf";

  const formulario = document.getElementById("formulario");
  const boton = document.getElementById("boton");
  const estado = document.getElementById("estado");
  const resultado = document.getElementById("resultado");

  const CAMPOS = ["carne", "local", "transporte", "km", "vuelos",
                  "aire", "personas", "ropa", "celular", "separa"];

  formulario.addEventListener("submit", async function (evento) {
    evento.preventDefault();

    const datos = new URLSearchParams();
    CAMPOS.forEach(function (nombre) {
      datos.append(nombre, document.getElementById(nombre).value);
    });

    boton.disabled = true;
    estado.className = "";
    estado.textContent = "Calculando tu huella...";
    resultado.style.display = "none";
    resultado.textContent = "";

    try {
      const respuesta = await fetch(WEBHOOK_URL, {
        method: "POST",
        body: datos
      });
      if (!respuesta.ok) { throw new Error("Respuesta no válida"); }
      const texto = await respuesta.text();
      resultado.textContent = texto;
      resultado.style.display = "block";
      estado.textContent = "";
    } catch (error) {
      estado.className = "error";
      estado.textContent = "No se pudo calcular, intenta de nuevo.";
    } finally {
      boton.disabled = false;
    }
  });
</script>

</body>
</html>
